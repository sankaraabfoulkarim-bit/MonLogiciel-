<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Circular Outer Medallion Border -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Inner Medallion Background -->
  <circle cx="256" cy="256" r="190" fill="#064E3B" filter="url(#shadow)" />

  <!-- Central Star of Burkina Faso at Top of Shield -->
  <polygon points="256,96 268,132 306,132 275,155 287,191 256,168 225,191 237,155 206,132 244,132" fill="url(#starGrad)" stroke="#F59E0B" stroke-width="2" />

  <!-- Scales of Justice & Finance (Balance) -->
  <!-- Beam -->
  <rect x="176" y="222" width="160" height="10" rx="5" fill="url(#goldGrad)" />
  <circle cx="256" cy="227" r="10" fill="url(#goldGrad)" />

  <!-- Central Column -->
  <rect x="252" y="210" width="8" height="136" rx="4" fill="url(#goldGrad)" />
  <!-- Base of Column -->
  <path d="M216 346 L296 346 L286 356 L226 356 Z" fill="url(#goldGrad)" />
  <rect x="206" y="356" width="100" height="12" rx="6" fill="url(#goldGrad)" />

  <!-- Left Pan Strings and Pan -->
  <line x1="186" y1="232" x2="162" y2="284" stroke="url(#goldGrad)" stroke-width="3" />
  <line x1="186" y1="232" x2="210" y2="284" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M152 284 Q186 310 220 284 Z" fill="url(#goldGrad)" />

  <!-- Right Pan Strings and Pan -->
  <line x1="326" y1="232" x2="302" y2="284" stroke="url(#goldGrad)" stroke-width="3" />
  <line x1="326" y1="232" x2="350" y2="284" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M292 284 Q326 310 360 284 Z" fill="url(#goldGrad)" />

  <!-- Quill / Plume crossing -->
  <path d="M220 380 C240 330, 290 280, 340 240 C340 240, 320 280, 280 340 C260 370, 240 380, 220 380 Z" fill="#FDE68A" opacity="0.3" />

  <!-- Text: ASF -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">ASF</text>
  <text x="256" y="446" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#FCD34D" text-anchor="middle" letter-spacing="2">PRÉPA FASO</text>
</svg>
